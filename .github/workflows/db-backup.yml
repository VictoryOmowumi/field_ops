# Nightly encrypted logical backup, because the Supabase Free plan has no backups.
#
# BEFORE RELYING ON THIS: run it manually once (Actions > Database backup > Run workflow), then
# download the file and TEST A RESTORE into a local or throwaway Postgres. See
# docs/ops/free-tier-runbook.md. A backup that has never been restored is not a backup.
#
# GitHub only fires `schedule` and shows `workflow_dispatch` for workflows on the DEFAULT branch.
#
# This repository is PUBLIC, so Actions logs are public. Tool output that could include a hostname,
# bucket, account ID or data is discarded; failures report only which step failed.
#
# Scope: the public and auth schemas. Evidence files and the storage schema are NOT included.
name: Database backup

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  # Must be >= the Supabase server's major version, or pg_dump refuses to run. Match it to the
  # version shown in the Supabase dashboard.
  PG_MAJOR: "17"
  RETENTION_DAYS: "14"
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq postgresql-common gnupg >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}" >/dev/null
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version

      - name: Dump and encrypt
        env:
          # Session-pooler connection string: GitHub runners have no IPv6.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::A required GitHub secret is not set."
            exit 1
          fi
          bin="/usr/lib/postgresql/${PG_MAJOR}/bin"
          work="$RUNNER_TEMP/backup"
          mkdir -p "$work"
          name="activationiq-$(date -u +%Y-%m-%dT%H%M%SZ).dump"

          if ! "$bin/pg_dump" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file="$work/$name" --dbname="$SUPABASE_DB_URL" >/dev/null 2>&1; then
            echo "::error::pg_dump failed (output suppressed because this repository is public)."
            exit 1
          fi
          if ! "$bin/pg_restore" --list "$work/$name" >/dev/null 2>&1; then
            echo "::error::The dump file failed its integrity check."
            exit 1
          fi

          if ! gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$work/$name.gpg" "$work/$name" \
            3<<<"$BACKUP_PASSPHRASE" >/dev/null 2>&1; then
            echo "::error::Encryption failed."
            exit 1
          fi
          if ! gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt "$work/$name.gpg" 3<<<"$BACKUP_PASSPHRASE" 2>/dev/null \
            | "$bin/pg_restore" --list >/dev/null 2>&1; then
            echo "::error::The encrypted file failed its decryption check."
            exit 1
          fi

          rm -f "$work/$name"
          echo "BACKUP_FILE=$name.gpg" >> "$GITHUB_ENV"
          echo "Encrypted backup created."

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] \
            || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BACKUP_BUCKET:-}" ]; then
            echo "::error::A required GitHub secret is not set."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          local_file="$RUNNER_TEMP/backup/$BACKUP_FILE"
          if ! aws s3 cp "$local_file" "s3://${R2_BACKUP_BUCKET}/db-backups/${BACKUP_FILE}" \
            --endpoint-url "$endpoint" --only-show-errors >/dev/null 2>&1; then
            echo "::error::Upload failed (output suppressed because this repository is public)."
            exit 1
          fi
          expected=$(stat -c %s "$local_file")
          actual=$(aws s3api head-object --bucket "$R2_BACKUP_BUCKET" --key "db-backups/${BACKUP_FILE}" \
            --endpoint-url "$endpoint" --query ContentLength --output text 2>/dev/null) || actual=""
          if [ "$expected" != "$actual" ]; then
            echo "::error::The uploaded backup failed its size check."
            exit 1
          fi
          echo "Upload verified."

      # Runs only after a verified upload, so a broken backup never removes older good ones.
      - name: Prune old backups
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          cutoff=$(date -u -d "${RETENTION_DAYS} days ago" +%F)
          if ! listing=$(aws s3 ls "s3://${R2_BACKUP_BUCKET}/db-backups/" --endpoint-url "$endpoint" 2>/dev/null); then
            echo "::error::Could not list existing backups."
            exit 1
          fi
          kept=0
          pruned=0
          failed=0
          pattern='^activationiq-([0-9]{4}-[0-9]{2}-[0-9]{2})T[0-9]{6}Z\.dump\.gpg$'
          while read -r _ _ _ name; do
            if [[ ! "${name:-}" =~ $pattern ]]; then
              continue
            fi
            if [[ "${BASH_REMATCH[1]}" < "$cutoff" ]]; then
              if aws s3 rm "s3://${R2_BACKUP_BUCKET}/db-backups/${name}" \
                --endpoint-url "$endpoint" --only-show-errors >/dev/null 2>&1; then
                pruned=$((pruned + 1))
              else
                failed=$((failed + 1))
              fi
            else
              kept=$((kept + 1))
            fi
          done <<< "$listing"
          echo "Backups kept: $kept, pruned: $pruned, failed to prune: $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::error::Some old backups could not be pruned."
            exit 1
          fi

      - name: Remove local files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/backup"
